[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lahjalens"
version = "0.1.0"
description = "Plateforme Big Data Analytics pour l'analyse de commentaires marocains"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyspark==3.5.7",
    "pyarrow>=14.0.0",
    "fastparquet>=2024.2.0",
    "pandas>=2.1.0",
    "pydantic>=2.5.0",
    "kafka-python-ng>=2.2.0",
    "mlflow>=2.10.0",
    "scikit-learn>=1.4.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.0",
    "streamlit>=1.32.0",
    "plotly>=5.19.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]